name: Release

# Push a tag such as v0.4.0 to build the disk image and publish a GitHub Release.
# Run it by hand (Actions → Release → Run workflow) to build the disk image as an artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build disk image
    runs-on: macos-26
    timeout-minutes: 45
    # Signing secrets live in this environment, which only tags v* and main can use.
    environment: release
    env:
      # Without these secrets the app has an ad hoc signature (see docs/RELEASING.md).
      HAS_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_API_KEY != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      notarized: ${{ steps.version.outputs.notarized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: build-app.sh sets CFBundleVersion to the commit count.
          fetch-depth: 0
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notarized=$([[ $HAS_CERTIFICATE == true && $HAS_NOTARY_KEY == true ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $version in Resources/Info.plist"
            exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test --parallel

      - name: Import Developer ID certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # The intermediate certificate, in case the .p12 has no chain.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          # Lets codesign use the key without a dialog.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [[ -z "$identity" ]]; then
            echo "::error::DEVELOPER_ID_CERTIFICATE_P12 has no Developer ID Application identity"
            exit 1
          fi
          echo "LEEWAY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Write notarization key
        if: env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          {
            echo "LEEWAY_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "LEEWAY_NOTARY_KEY_ID=$NOTARY_API_KEY_ID"
            echo "LEEWAY_NOTARY_ISSUER=$NOTARY_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build disk image
        run: ./scripts/make-release.sh

      - name: Check signature
        run: |
          codesign --verify --strict --deep --verbose=2 build/Leeway.app
          if [[ ${{ steps.version.outputs.notarized }} == true ]]; then
            spctl --assess --type execute --verbose build/Leeway.app
            xcrun stapler validate build/Leeway-*.dmg
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Leeway-${{ steps.version.outputs.version }}
          path: |
            build/Leeway-*.dmg
            build/Leeway-*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          [[ -n "${KEYCHAIN_PATH:-}" ]] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/notary.p8"

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    # A separate job without secrets is the only one that can write to the repository.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Leeway-${{ needs.build.outputs.version }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTARIZED: ${{ needs.build.outputs.notarized }}
        run: |
          sha=$(cut -d' ' -f1 dist/Leeway-"$VERSION".dmg.sha256)
          {
            echo "## Install"
            echo
            echo "1. Download **Leeway-$VERSION.dmg** below and open it."
            echo "2. Drag **Leeway** onto **Applications**, then open it from Applications."
            echo
            if [[ $NOTARIZED != true ]]; then
              echo "This build is not notarized by Apple. On the first launch, macOS blocks it: open"
              echo "**System Settings → Privacy & Security** and click **Open Anyway** (once for each version)."
              echo
            fi
            echo "Requires macOS 15 or later. Apple silicon and Intel."
            echo
            echo "SHA-256: \`$sha\`"
            echo
          } > notes.md
          prerelease=()
          [[ $VERSION == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Leeway $VERSION" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
